plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def otterKeystoreFile = file(System.getenv("OTTER_ANDROID_KEYSTORE") ?: "${System.getProperty('user.home')}/.otter/otter-phone-release.jks")
def hasOtterKeystore = otterKeystoreFile.exists()

android {
    namespace 'vn.phonecloud.agent'
    compileSdk 34

    defaultConfig {
        applicationId "vn.otter.phone"
        minSdk 26
        targetSdk 34
        versionCode 20401
        versionName "2.4.1"
    }

    signingConfigs {
        if (hasOtterKeystore) {
            release {
                storeFile otterKeystoreFile
                storePassword System.getenv("OTTER_ANDROID_KEYSTORE_PASS") ?: "otter2026release"
                keyAlias System.getenv("OTTER_ANDROID_KEY_ALIAS") ?: "otterphone"
                keyPassword System.getenv("OTTER_ANDROID_KEY_PASS") ?: "otter2026release"
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasOtterKeystore ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'io.socket:socket.io-client:2.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
