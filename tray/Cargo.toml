[package]
name = "otter-tray"
version = "2.0.0"
edition = "2021"
description = "Otter Agent Native System Tray & Menu Bar Controller"

[dependencies]
tray-item = "0.10.0"
open = "5.4.5"
arboard = { version = "3.7.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader"
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
